<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>ANR Mining</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080b12;
    color:#fff;
    min-height:100vh;
}
.app{
    max-width:520px;
    margin:auto;
    min-height:100vh;
    padding-bottom:85px;
}
.header{
    padding:20px 18px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo{
    display:flex;
    align-items:center;
    gap:10px;
}
.logoIcon{
    width:45px;
    height:45px;
    border-radius:14px;
    background:linear-gradient(135deg,#6c5ce7,#00d2ff);
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:900;
    font-size:18px;
}
.logoText h2{font-size:19px}
.logoText span{
    font-size:11px;
    color:#858b9b;
}
.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#171b27;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:20px;
}
.balance{
    margin:15px 16px;
    padding:22px;
    border-radius:24px;
    background:linear-gradient(145deg,#15182b,#0e1420);
    border:1px solid #252a40;
    text-align:center;
}
.balance small{
    color:#8e95a8;
}
.balance h1{
    margin:8px 0;
    font-size:34px;
}
.balance p{
    color:#7c83ff;
    font-size:13px;
}
.mining{
    display:flex;
    justify-content:center;
    padding:18px;
}
.coin{
    width:190px;
    height:190px;
    border-radius:50%;
    border:10px solid #28234b;
    background:radial-gradient(circle,#7567ff,#4433b8);
    box-shadow:0 0 45px rgba(108,92,231,.45);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    user-select:none;
    transition:.12s;
}
.coin:active{
    transform:scale(.94);
}
.coin strong{
    font-size:45px;
}
.coin span{
    font-size:12px;
    opacity:.8;
}
.energy{
    margin:0 18px 18px;
}
.energyTop{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:7px;
    color:#aeb4c4;
}
.bar{
    height:8px;
    background:#1d2230;
    border-radius:20px;
    overflow:hidden;
}
.bar i{
    display:block;
    width:100%;
    height:100%;
    background:linear-gradient(90deg,#6c5ce7,#00d2ff);
    border-radius:20px;
}
.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    padding:0 16px;
}
.card{
    background:#11151f;
    border:1px solid #222837;
    padding:16px;
    border-radius:18px;
}
.card span{
    color:#858b9b;
    font-size:12px;
}
.card h3{
    margin-top:7px;
    font-size:18px;
}
.section{
    padding:22px 16px 5px;
}
.section h3{
    font-size:17px;
}
.tasks{
    padding:12px 16px;
}
.task{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#11151f;
    border:1px solid #222837;
    padding:14px;
    border-radius:17px;
    margin-bottom:10px;
}
.taskLeft{
    display:flex;
    align-items:center;
    gap:12px;
}
.taskIcon{
    width:40px;
    height:40px;
    border-radius:12px;
    background:#1b2030;
    display:flex;
    justify-content:center;
    align-items:center;
}
.task button{
    border:0;
    background:#6657e8;
    color:#fff;
    padding:9px 14px;
    border-radius:10px;
    font-weight:bold;
}
.bottom{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    max-width:520px;
    margin:auto;
    height:72px;
    background:#10141d;
    border-top:1px solid #222837;
    display:flex;
    justify-content:space-around;
    align-items:center;
}
.nav{
    color:#70788c;
    text-align:center;
    font-size:11px;
    cursor:pointer;
}
.nav b{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}
.nav.active{
    color:#7567ff;
}
.toast{
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%);
    background:#fff;
    color:#111;
    padding:11px 17px;
    border-radius:12px;
    display:none;
    font-size:13px;
    z-index:99;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
    <div class="logo">
        <div class="logoIcon">ANR</div>
        <div class="logoText">
            <h2>ANR Mining</h2>
            <span>Tap • Mine • Earn</span>
        </div>
    </div>
    <div class="avatar">👤</div>
</header>

<section class="balance">
    <small>Total Balance</small>
    <h1 id="balance">0.00</h1>
    <p>ANR COINS</p>
</section>

<section class="mining">
    <div class="coin" id="coin">
        <strong>ANR</strong>
        <span>TAP TO MINE</span>
    </div>
</section>

<section class="energy">
    <div class="energyTop">
        <span>⚡ Energy</span>
        <span id="energyText">1000 / 1000</span>
    </div>
    <div class="bar">
        <i id="energyBar"></i>
    </div>
</section>

<section class="grid">

<div class="card">
    <span>Mining Speed</span>
    <h3>+<span id="speed">1</span> ANR/Tap</h3>
</div>

<div class="card">
    <span>Daily Reward</span>
    <h3>🎁 500 ANR</h3>
</div>

<div class="card">
    <span>Level</span>
    <h3>Level 1</h3>
</div>

<div class="card">
    <span>Referrals</span>
    <h3 id="referrals">0 👥</h3>
</div>

</section>

<div class="section">
    <h3>Daily Tasks</h3>
</div>

<div class="tasks">

<div class="task">
    <div class="taskLeft">
        <div class="taskIcon">📢</div>
        <div>
            <b>Join our channel</b><br>
            <small style="color:#858b9b">+100 ANR</small>
        </div>
    </div>
    <button onclick="completeTask()">START</button>
</div>

<div class="task">
    <div class="taskLeft">
        <div class="taskIcon">🎬</div>
        <div>
            <b>Watch Reward Ad</b><br>
            <small style="color:#858b9b">+50 ANR</small>
        </div>
    </div>
    <button onclick="showAd()">WATCH</button>
</div>

</div>

</div>

<nav class="bottom">

<div class="nav active" onclick="home()">
    <b>⛏️</b>Mine
</div>

<div class="nav" onclick="tasks()">
    <b>🎯</b>Tasks
</div>

<div class="nav" onclick="referral()">
    <b>👥</b>Friends
</div>

<div class="nav" onclick="withdraw()">
    <b>💰</b>Wallet
</div>

</nav>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){
    tg.ready();
    tg.expand();
}

let balance = Number(localStorage.getItem("anr_balance") || 0);
let energy = Number(localStorage.getItem("anr_energy") || 1000);

let settings = JSON.parse(
    localStorage.getItem("anr_settings") ||
    '{"tapReward":1,"maxEnergy":1000,"energyCost":1}'
);

function save(){
    localStorage.setItem("anr_balance",balance);
    localStorage.setItem("anr_energy",energy);
}

function update(){
    document.getElementById("balance").innerText =
        balance.toFixed(2);

    let max = Number(settings.maxEnergy || 1000);

    document.getElementById("energyText").innerText =
        energy+" / "+max;

    document.getElementById("energyBar").style.width =
        Math.max(0,(energy/max)*100)+"%";

    document.getElementById("speed").innerText =
        settings.tapReward || 1;
}

document.getElementById("coin").addEventListener("click",function(){

    if(energy < Number(settings.energyCost || 1)){
        toast("⚡ Energy শেষ!");
        return;
    }

    balance += Number(settings.tapReward || 1);
    energy -= Number(settings.energyCost || 1);

    save();
    update();
});

setInterval(function(){

    let max = Number(settings.maxEnergy || 1000);

    if(energy < max){
        energy++;
        save();
        update();
    }

},1000);

function toast(text){
    let t=document.getElementById("toast");
    t.innerText=text;
    t.style.display="block";

    setTimeout(()=>{
        t.style.display="none";
    },1800);
}

function completeTask(){
    balance += 100;
    save();
    update();
    toast("+100 ANR Added!");
}

function showAd(){
    /*
      Monetag / GigaPub SDK এখানে বসবে।
      Admin panel থেকে কোন network active
      সেটি নির্ধারণ করা যাবে।
    */

    balance += 50;
    save();
    update();
    toast("+50 ANR Reward!");
}

function home(){
    window.scrollTo({top:0,behavior:"smooth"});
}

function tasks(){
    document.querySelector(".tasks")
    .scrollIntoView({behavior:"smooth"});
}

function referral(){
    toast("Referral system coming soon");
}

function withdraw(){
    toast("Minimum withdrawal settings required");
}

update();
</script>

</body>
  </html>
